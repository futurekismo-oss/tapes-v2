[package]
name = "tapes-v2"
version = "0.1.0-beta"
edition = "2024"
description = "Atomic per-target dotfile switcher"
license = "MIT"                 
repository = "https://github.com/futurekismo-oss/tapes-v2"
homepage = "https://github.com/futurekismo-oss/tapes-v2"
readme = "README.md"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
env_logger = "0.11.11"
log = "0.4.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"
nix = { version = "0.29", default-features = false, features = ["fs"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }-v{ version }{ archive-suffix }"
bin-dir = "{ name }-{ target }-v{ version }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"
disabled-strategies = ["quick-install", "compile"]
