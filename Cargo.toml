[package]
name = "tapes-v2"
version = "0.1.3-beta"
edition = "2024"
description = "Swap your whole rice in one command. Eject it with one more. Atomic dotfiles switching for Linux."
readme = "README.md"
homepage = "https://github.com/futurekismo-oss/tapes-v2"
repository = "https://github.com/futurekismo-oss/tapes-v2"
license = "MIT"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }-v{ version }{ archive-suffix }"
bin-dir = "{ name }-{ target }-v{ version }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"
disabled-strategies = ["quick-install", "compile"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = { version = "4.6.11", features = ["unstable-dynamic"] }
dirs = "7.0.0"
log = "0.4.35"
nix = { version = "0.31.3", default-features = false, features = ["fs"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"

[profile.release]
opt-level = 3
strip = "symbols"
lto = "thin"
panic = "abort"
codegen-units = 1
