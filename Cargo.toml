[package]
name = "tapes"
version = "2.0.0"
edition = "2024"
rust-version = "1.85"
description = "Atomic, per-target dotfile switcher for ricing (v2, CLI-only)"
license = "MIT"
repository = "https://github.com/futurekismo-oss/cassette-rices"
keywords = ["dotfiles", "ricing", "hyprland", "quickshell", "symlink"]
categories = ["command-line-utilities"]

[[bin]]
name = "tape"
path = "src/main.rs"

[lib]
name = "tapes"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "color", "suggestions"] }
fs4 = "0.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
time = { version = "0.3", features = ["formatting", "parsing"] }
toml = { version = "0.8", features = ["parse", "display"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
xdg = "2.5"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.10"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0
debug = true

[profile.dev.package."*"]
opt-level = 2

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
correctness = "deny"
suspicious = "warn"
style = "warn"
complexity = "warn"
perf = "warn"
