[package]
name = "tapes-v2"
version = "0.1.7-beta"
edition = "2024"
description = "Atomic dotfiles switcher for Linux and Ricing."
readme = "README.md"
homepage = "https://github.com/futurekismo-oss/tapes"
repository = "https://github.com/futurekismo-oss/tapes"
license = "MIT"
exclude = [
  "media/",
]

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/tapes-{ target }-v{ version }{ archive-suffix }"
bin-dir = "tapes-{ target }-v{ version }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"
disabled-strategies = ["quick-install", "compile"]

[[bin]]
name = "tapes"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = { version = "4.6.11", features = ["unstable-dynamic"] }
dirs = "7.0.0"
log = "0.4.35"
nix = { version = "0.31.3", default-features = false, features = ["fs"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.0"

[dev-dependencies]
tempfile = "3.27.0"

[profile.dev]
debug = 1

[profile.release]
opt-level = 3
strip = "symbols"
lto = "thin"
panic = "abort"
codegen-units = 16
