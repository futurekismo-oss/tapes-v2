name: Rust Build and Release

on:
  push:
    branches:
    - "main"

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to create releases and attach binary artifacts

    steps:
    - uses: actions/checkout@v4

    - name: Build (Release Mode)
      run: cargo build --release --verbose

    - name: Install cargo-binstall
      uses: cargo-bins/cargo-binstall@v1.26.1

    - name: Create GitHub Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # Replace 'your_project_name' with the actual binary name from your Cargo.toml
        gh release create ${{ github.ref_name }} target/release/tapes-v2 \
          --title "Release ${{ github.ref_name }}" \
          --generate-notes
