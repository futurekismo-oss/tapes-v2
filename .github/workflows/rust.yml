name: Rust Build and Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Build (Release Mode)
      run: cargo build --release --verbose

    - name: Create Archive and GitHub Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        ARCHIVE_NAME="tapes-v2-x86_64-unknown-linux-gnu-${{ github.ref_name }}"

        mkdir -p "$ARCHIVE_NAME"
        cp target/release/tapes-v2 "$ARCHIVE_NAME/"

        tar -czf "${ARCHIVE_NAME}.tgz" "$ARCHIVE_NAME"

        gh release create ${{ github.ref_name }} "${ARCHIVE_NAME}.tgz" \
          --title "Release ${{ github.ref_name }}" \
          --generate-notes
